<!doctype html>
<meta charset="utf-8" />
<title>Scenariusz: powrót do dziś</title>
<!--
  Scenariusz w prawdziwej przeglądarce dla punktu 9 (powrót do dzisiejszej daty).
  Uruchomienie: npm start, potem http://localhost:8000/tools/scenarios/powrot-do-dzis.html
  Aplikacja działa w ramce, a czas i timery są podmieniane w jej oknie (zegar przesuwany o godziny, timer północy
  przechwytywany i odpalany ręcznie), więc nic nie trzeba czekać.
  UWAGA: scenariusz czyści localStorage adresu localhost:8000. Dane są kopiowane na początku i przywracane na końcu,
  ale na wszelki wypadek zrób kopię zapasową wpisów przed uruchomieniem.
-->
<style>
  body { font: 13px/1.5 monospace; margin: 12px; }
  iframe { width: 390px; height: 260px; border: 1px solid #999; }
  .ok { color: #1a7f37; }
  .bad { color: #c00; font-weight: bold; }
</style>
<iframe id="frame" title="aplikacja"></iframe>
<pre id="out"></pre>
<script type="module">
  import { addDaysKey, formatDatePL, todayKey } from '/js/dates.js';

  const out = document.getElementById('out');
  const frame = document.getElementById('frame');
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const MINUTE = 60 * 1000;
  const HOUR = 60 * MINUTE;
  const KEYS = {
    entries: 'gratitude_journal_entries_v1',
    drafts: 'gratitude_journal_drafts_v1',
    theme: 'gratitude_journal_theme',
  };
  let failures = 0;

  function check(name, condition, extra = '') {
    if (!condition) failures++;
    const cls = condition ? 'ok' : 'bad';
    out.insertAdjacentHTML('beforeend', `<span class="${cls}">${condition ? 'OK  ' : 'FAIL'}</span> ${name} ${extra}\n`);
  }

  const win = () => frame.contentWindow;
  const doc = () => frame.contentDocument;
  const $ = (selector) => doc().querySelector(selector);
  const drafts = () => JSON.parse(localStorage.getItem(KEYS.drafts) || '{}');
  const appToday = () => todayKey(new Date(Date.now() + win().__offsetMs));
  const selectedLabel = () => $('#dateTriggerLabel').textContent;
  const noticeVisible = () => !$('#notice').hidden;
  const draftOf = (key) => ({ grateful: ['szkic ' + key, '', ''], why: '', person: '', proud: '', lesson: '', updatedAt: 5 });

  /** Ramka z kodem aplikacji, w której czas przesuwamy o __offsetMs, a długie timery (północ) przechwytujemy. */
  async function boot({ seedDrafts = {}, seedEntries = {} } = {}) {
    localStorage.setItem(KEYS.entries, JSON.stringify(seedEntries));
    localStorage.setItem(KEYS.drafts, JSON.stringify(seedDrafts));
    const html = await (await fetch('/index.html', { cache: 'no-store' })).text();
    const prelude = `<base href="/"><script>
      window.__offsetMs = 0; window.__midnight = [];
      const RealDate = Date;
      window.Date = class extends RealDate {
        constructor(...args) { if (args.length === 0) super(RealDate.now() + window.__offsetMs); else super(...args); }
        static now() { return RealDate.now() + window.__offsetMs; }
      };
      const realSetTimeout = window.setTimeout.bind(window);
      window.setTimeout = (fn, ms, ...rest) => ms > 60000 ? (window.__midnight.push(fn), 0) : realSetTimeout(fn, ms, ...rest);
    <\/script>`;
    await new Promise((resolve) => {
      frame.onload = resolve;
      frame.srcdoc = html.replace('<head>', '<head>' + prelude);
    });
    await sleep(250);
  }

  function setVisibility(state) {
    Object.defineProperty(doc(), 'visibilityState', { value: state, configurable: true });
    doc().dispatchEvent(new Event('visibilitychange'));
  }

  /** Aplikacja idzie w tło, mija czas, aplikacja wraca. */
  async function awayFor(ms) {
    setVisibility('hidden');
    win().__offsetMs += ms;
    setVisibility('visible');
    await sleep(120);
  }

  async function pickDay(key) {
    if ($('#calendarPanel').hidden) $('#dateTrigger').click();
    await sleep(30);
    $(`.cal-day[data-date="${key}"]`).click();
    await sleep(80);
  }

  function typeInto(selector, value) {
    const element = $(selector);
    element.value = value;
    element.dispatchEvent(new Event('input', { bubbles: true }));
  }

  const backup = Object.fromEntries(Object.keys(localStorage).map((key) => [key, localStorage.getItem(key)]));

  try {
    const D0 = todayKey();
    const D_1 = addDaysKey(D0, -1);
    const D_3 = addDaysKey(D0, -3);
    const D1 = addDaysKey(D0, 1);

    // A. zimny start: dziś, bez baneru
    await boot();
    check('A1 zimny start pokazuje dziś', selectedLabel() === formatDatePL(D0), selectedLabel());
    check('A2 wskaźnik „Nowy wpis na dziś”', $('#entryIndicator').textContent.includes('Nowy wpis na dziś'));
    check('A3 bez szkiców nie ma baneru', !noticeVisible());

    // B. zimny start ze szkicem z innego dnia: baner i „Otwórz”
    await boot({ seedDrafts: { [D_3]: draftOf(D_3) } });
    check('B1 zimny start nadal pokazuje dziś, mimo szkicu z innego dnia', selectedLabel() === formatDatePL(D0));
    check('B2 baner o szkicu jest widoczny z datą', noticeVisible() && $('#noticeText').textContent.includes(formatDatePL(D_3)), $('#noticeText').textContent);
    check('B3 przycisk baneru to „Otwórz”', $('#noticeAction').textContent === 'Otwórz');
    $('#noticeAction').click();
    await sleep(100);
    check('B4 „Otwórz” przechodzi na dzień szkicu', selectedLabel() === formatDatePL(D_3), selectedLabel());
    check('B5 formularz zawiera szkic', $('#g1').value === 'szkic ' + D_3, $('#g1').value);
    check('B6 baner znika po otwarciu', !noticeVisible());

    // C. powrót z tła po krótkiej przerwie: wybór zostaje
    await boot();
    await pickDay(D_1);
    await awayFor(5 * MINUTE);
    check('C1 po 5 minutach w tle wybrany dzień zostaje', selectedLabel() === formatDatePL(D_1), selectedLabel());

    // D. powrót z tła po dłuższej przerwie: dziś
    await boot();
    await pickDay(D_1);
    await awayFor(11 * MINUTE);
    check('D1 po 11 minutach w tle wracamy na dziś', selectedLabel() === formatDatePL(D0), selectedLabel());
    check('D2 wskaźnik „Nowy wpis na dziś”', $('#entryIndicator').textContent.includes('Nowy wpis na dziś'));

    // E. powrót z tła z rozgrzebanym formularzem: tekst bezpieczny w szkicu, baner proponuje go otworzyć
    await boot();
    await pickDay(D_1);
    typeInto('#g1', 'rozpoczęte wczoraj');
    await awayFor(30 * MINUTE);
    check('E1 wracamy na dziś', selectedLabel() === formatDatePL(D0), selectedLabel());
    check('E2 szkic poprzedniego dnia przetrwał', drafts()[D_1]?.grateful[0] === 'rozpoczęte wczoraj', JSON.stringify(drafts()[D_1]));
    check('E3 baner proponuje otwarcie szkicu', noticeVisible() && $('#noticeText').textContent.includes(formatDatePL(D_1)), $('#noticeText').textContent);
    $('#noticeAction').click();
    await sleep(100);
    check('E4 „Otwórz” przywraca wpisany tekst', $('#g1').value === 'rozpoczęte wczoraj' && selectedLabel() === formatDatePL(D_1));

    // F. powrót po zmianie dnia (krótka przerwa): nowy dzień, odświeżone etykiety i kalendarz
    await boot();
    await awayFor(25 * HOUR);
    check('F1 data w nagłówku to nowy dzień', $('#todayLabel').textContent === formatDatePL(appToday()), $('#todayLabel').textContent + ' / ' + formatDatePL(appToday()));
    check('F2 wybrany jest nowy dzień', selectedLabel() === formatDatePL(appToday()));
    $('#dateTrigger').click();
    await sleep(40);
    check('F3 pierścień „dziś” w kalendarzu jest na nowym dniu', $('.cal-day.today')?.dataset.date === appToday(), $('.cal-day.today')?.dataset.date);
    check('F4 wskaźnik „Nowy wpis na dziś”', $('#entryIndicator').textContent.includes('Nowy wpis na dziś'));

    // G. północ przy otwartej aplikacji, formularz nietknięty: po cichu nowy dzień
    await boot();
    check('G0 timer północy jest ustawiony', win().__midnight.length >= 1);
    win().__offsetMs += 25 * HOUR;
    win().__midnight.pop()();
    await sleep(120);
    check('G1 po cichu przeszło na nowy dzień', selectedLabel() === formatDatePL(appToday()));
    check('G2 data w nagłówku odświeżona', $('#todayLabel').textContent === formatDatePL(appToday()));
    check('G3 bez baneru', !noticeVisible());
    check('G4 timer na kolejną północ ustawiony ponownie', win().__midnight.length >= 1);

    // H. północ, użytkowniczka pisze: nie przerywamy, jest propozycja przejścia
    await boot();
    typeInto('#g1', 'piszę o północy');
    win().__offsetMs += 25 * HOUR;
    win().__midnight.pop()();
    await sleep(120);
    check('H1 wybór i wpisany tekst zostają', selectedLabel() === formatDatePL(D0) && $('#g1').value === 'piszę o północy', selectedLabel());
    check('H2 baner „Jest już nowy dzień”', noticeVisible() && $('#noticeText').textContent.includes('nowy dzień'), $('#noticeText').textContent);
    check('H3 przycisk baneru to „Przejdź do dziś”', $('#noticeAction').textContent === 'Przejdź do dziś');
    check('H4 data w nagłówku jest już nowa', $('#todayLabel').textContent === formatDatePL(appToday()));
    $('#noticeAction').click();
    await sleep(150);
    check('H5 „Przejdź do dziś” przechodzi na nowy dzień', selectedLabel() === formatDatePL(appToday()));
    check('H6 tekst z północy zapisał się w szkicu starego dnia', drafts()[D0]?.grateful[0] === 'piszę o północy', JSON.stringify(drafts()[D0]));
    check('H7 baner proponuje teraz szkic ze starego dnia', noticeVisible() && $('#noticeText').textContent.includes(formatDatePL(D0)), $('#noticeText').textContent);

    // I. północ, wybrany był inny dzień: wybór zostaje, etykiety się odświeżają
    await boot();
    await pickDay(D_3);
    win().__offsetMs += 25 * HOUR;
    win().__midnight.pop()();
    await sleep(120);
    check('I1 wybrany inny dzień zostaje', selectedLabel() === formatDatePL(D_3));
    check('I2 data w nagłówku odświeżona', $('#todayLabel').textContent === formatDatePL(appToday()));
    check('I3 bez baneru', !noticeVisible());

    // J. pageshow po bfcache działa jak powrót z tła
    await boot();
    await pickDay(D_1);
    setVisibility('hidden');
    win().dispatchEvent(new (win().Event)('pagehide'));
    win().__offsetMs += 15 * MINUTE;
    win().dispatchEvent(Object.assign(new (win().Event)('pageshow'), { persisted: true }));
    await sleep(120);
    check('J1 pageshow (bfcache) po 15 minutach wraca na dziś', selectedLabel() === formatDatePL(D0), selectedLabel());

    // K. ręczne „Dziś” nadal działa
    await boot();
    await pickDay(D_3);
    $('#todayBtn').click();
    await sleep(100);
    check('K1 przycisk „Dziś” wraca na dziś', selectedLabel() === formatDatePL(D0));

    // L. bez zmiany dnia i na dziś nic się nie dzieje przy powrocie (tekst nie ginie)
    await boot();
    typeInto('#g1', 'dopiero zaczęłam');
    await awayFor(40 * MINUTE);
    check('L1 na „dziś” po długim czasie w tle tekst zostaje w formularzu', $('#g1').value === 'dopiero zaczęłam' && selectedLabel() === formatDatePL(D0));
    check('L2 bez baneru', !noticeVisible());
    void D1;
  } catch (error) {
    failures++;
    out.insertAdjacentHTML('beforeend', `<span class="bad">WYJĄTEK: ${error.stack}</span>\n`);
  } finally {
    localStorage.clear();
    for (const [key, value] of Object.entries(backup)) localStorage.setItem(key, value);
    out.insertAdjacentHTML('beforeend', `\n<b>Niepowodzenia: ${failures}</b> (dane localStorage przywrócone)\n`);
    document.title = failures ? 'FAIL' : 'ALL OK';
  }
</script>
